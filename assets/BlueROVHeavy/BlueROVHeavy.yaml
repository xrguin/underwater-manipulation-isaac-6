  # Body-frame positions. Originally HoloOcean/BYU CAD-derived (MIT), but the
  # z-coords are flipped here to match the physical BlueROV2-Heavy frame
  # (verticals on TOP, vectored horizontals on BOTTOM — verified against the
  # front-view photo `heavy-front-1.webp`). Body +z is up, so verticals at
  # z = +0.085 m sit 8.5 cm above the angled horizontals at z = -0.085 m.
  positions:
  - [ 0.156, -0.111, -0.04]   # rotor_0  AFP  fore-port  angled  (below COG)
  - [ 0.156,  0.111, -0.04]   # rotor_1  AFS  fore-starboard  angled
  - [-0.156, -0.111, -0.04]   # rotor_2  ABP  aft-port  angled
  - [-0.156,  0.111, -0.04]   # rotor_3  ABS  aft-starboard  angled
  - [ 0.120, -0.218,  0.0]   # rotor_4  VFP  fore-port  vertical  (above COG)
  - [ 0.120,  0.218,  0.0]   # rotor_5  VFS  fore-starboard  vertical
  - [-0.120, -0.218,  0.0]   # rotor_6  VBP  aft-port  vertical
  - [-0.120,  0.218,  0.0]   # rotor_7  VBS  aft-starboard  vertical
  # Body-frame thrust direction unit vectors (also from HoloOcean).
  thrust_axes:
  - [ 0.707,  0.707, 0.0]      # rotor_0  AFP  thrust fore-starboard
  - [ 0.707, -0.707, 0.0]      # rotor_1  AFS  thrust fore-port
  - [-0.707,  0.707, 0.0]      # rotor_2  ABP  thrust aft-starboard
  - [-0.707, -0.707, 0.0]      # rotor_3  ABS  thrust aft-port
  - [0.0, 0.0, 1.0]            # rotor_4  VFP  up
  - [0.0, 0.0, 1.0]            # rotor_5  VFS  up
  - [0.0, 0.0, 1.0]            # rotor_6  VBP  up
  - [0.0, 0.0, 1.0]            # rotor_7  VBS  up
